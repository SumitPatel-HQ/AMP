[project]
name = "amis"
version = "0.1.0"
description = "AMIS: adaptive mission planning simulator for Earth observation satellites"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.28,<1",
    "mypy>=1.18,<2",
    "pytest>=9,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
