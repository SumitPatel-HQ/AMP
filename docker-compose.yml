services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: amis
      POSTGRES_USER: amis
      POSTGRES_PASSWORD: amis
    volumes:
      - amis-postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amis -d amis"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      AMIS_DATABASE_URL: postgresql+psycopg2://amis:amis@db:5432/amis
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  amis-postgres-data:
